# Moteur de décision (SPEC §7). Les décisions sont dans regles/decisions.yaml,
# les routages des services dans Statuts_services ; ce fichier dit seulement
# comment appliquer les routages.

# Routage qui crée une exception sans être plus sévère qu'une décision.
routage_decision: décision

# Sévérité décroissante : routage final du dossier = le plus sévère de ses étapes.
ordre_routages: [incident, sortie, conversion, décision, auto]

# Routage d'un statut de service absent de Statuts_services.
statut_inconnu:
  routage: incident
  motif: statut de service inconnu

# Services dont un routage « décision » n'arrête pas la génération : on
# utilise le repli et une exception est créée (SPEC §7).
decision_non_bloquante:
  - idref-linker /align/person
  - idref-linker /align/thesis-organizations
  - dewey-classifier

# Alertes ajoutées pour un (service, statut).
alertes_statut:
  idref-linker /align/person:
    not_found: proto-notice d'autorité à créer
  idref-linker /align/thesis-organizations:
    not_found: proto-notice d'autorité à créer

# Valeur d'etat_sudoc quand sudoc-checker n'est pas appelé (notice trouvée
# dans Alma : arrêt, S01 correspond par son joker).
etat_sudoc_non_verifie: non vérifié

# Motifs d'arrêt du workflow (SPEC §3.1, §6).
motifs:
  provenance: provenance à confirmer
  sudoc_indetermine: nature de la notice Sudoc non qualifiable
  document_invalide: document invalide
  titre_absent: titre non extrait
  seuil_sudoc: duplicate_threshold de sudoc-checker absent de config/services.yaml
