# Correspondance statut alma-checker → etat_alma (SPEC §6).
# Notice trouvée au-dessus de match_threshold : `présent`, arrêt sans alerte (S01).
# Candidat entre ambiguous_threshold et match_threshold, ou notice proche hors
# type TU : `incertain`, arrêt en décision (S14) — décision du 05/11.
correspondance:
  academic_record_found: présent
  ambiguous_academic_candidate: incertain
  off_profile_match_only: incertain
  no_academic_record_found: absent

# Motif affiché par statut.
motifs:
  academic_record_found: notice de thèse ou mémoire trouvée
  ambiguous_academic_candidate: candidat incertain
  off_profile_match_only: notice proche, pas de type TU
