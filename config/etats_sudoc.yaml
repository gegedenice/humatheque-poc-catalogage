# Agrégation des thesis_state de sudoc-checker en état du document (SPEC §6).

# Correspondance thesis_state → etat_sudoc.
correspondance:
  printed_original: originale imprimée
  printed_reproduction: reproduction imprimée
  microfiche_reproduction: reproduction microfiche
  electronic: électronique seule

# Ordre de force décroissante.
ordre:
  - originale imprimée
  - reproduction imprimée
  - reproduction microfiche
  - électronique seule

# États produits hors correspondance.
etat_inconnu: indéterminé       # candidat retenu `unknown`
etat_ambigu: ambigu             # aucun candidat retenu + ambiguous_print_candidate
etat_rien: rien                 # aucun candidat retenu
