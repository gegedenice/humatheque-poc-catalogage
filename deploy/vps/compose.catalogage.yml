# Service à coller dans le compose de la stack (Traefik, réseau « web »).
# Le dépôt est cloné à côté du compose : ./humatheque-poc-catalogage
# Domaine : à adapter (enregistrement DNS A vers le VPS).
services:
  catalogage:
    build:
      context: ./humatheque-poc-catalogage
    container_name: humatheque-catalogage
    restart: unless-stopped

    # Fichier propre à l'application (noms de variables distincts de ./.env)
    env_file:
      - ./.catalogage.env
    environment:
      # Traefik transmet X-Forwarded-* (schéma https, IP du client)
      - FORWARDED_ALLOW_IPS=*

    volumes:
      # Base SQLite et dossiers des documents
      - ./humatheque-poc-catalogage/data:/app/data
      # Règles et prompts modifiés depuis l'administration : écrits dans le clone (à commiter)
      - ./humatheque-poc-catalogage/regles:/app/regles
      - ./humatheque-poc-catalogage/config/prompts:/app/config/prompts

    networks:
      - web

    labels:
      - traefik.enable=true
      - traefik.docker.network=web
      - traefik.http.routers.catalogage.rule=Host(`catalogage.smartbiblia.fr`)
      - traefik.http.routers.catalogage.entrypoints=websecure
      - traefik.http.routers.catalogage.tls.certresolver=le
      - traefik.http.services.catalogage.loadbalancer.server.port=8000
