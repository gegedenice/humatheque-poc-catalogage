profil: these-reproduction-imprimee
libelle: Thèse de reproduction imprimée
variables: [annee, langue, langue_resume, titre_classement, sous_titre, auteur, directeur,
            president, rapporteur, membre_jury, diplome, discipline, etablissement, cotutelle,
            ecole_doctorale, volumaison, dewey]

# Une ligne = une zone, écrite comme dans WinIBW.
#   {variable} ou {variable.attribut}  valeur du document
#   ligne || repli                     repli utilisé si une variable de la ligne manque
# Forme développée quand il faut préciser : ligne, si, priorite, joindre, remarque,
#   à_valider (ligne encore en discussion), actif (false : zone documentée, non produite).
lignes:
  - {ligne: "008 $aAax3", priorite: 1}
  - {ligne: "100 0#$a{annee} || 100 0#$a19XX", priorite: 1, à_valider: true,
     remarque: "repli à harmoniser avec 214 et 328"}
  - {ligne: "101 0#$a{langue}$d{langue_resume}", priorite: 1}
  - {ligne: "102 ##$aFR", priorite: 1}
  - {ligne: "104 ##$ak$by$cy$dba$e0$ffre", priorite: 2}
  - {ligne: "105 ##$aa$bv$ba$c0$d0$e0$fy$gy", priorite: 1, à_valider: true,
     remarque: "valeurs par défaut de $a, $e et $g à confirmer"}
  - {ligne: "106 ##$ar", priorite: 3}
  - {ligne: "181 ##$P01$ctxt", priorite: 1}
  - {ligne: "182 ##$P01$cn", priorite: 1}
  - {ligne: "183 ##$P01$anga", priorite: 1}
  - {ligne: "200 1#$a{titre_classement}$e{sous_titre}$f{auteur}$gsous la direction de {directeur}", priorite: 1,
     joindre: {directeur: [", ", " et "]}, à_valider: true,
     remarque: "un seul $g : « sous la direction de A et B » (décision du 06/11)"}
  - {ligne: "214 #1$d{annee} || 214 #1$d19..", priorite: 1, à_valider: true}
  - {ligne: "215 ##$a{volumaison}", priorite: 1, à_valider: true}
  - {ligne: "328 #0$zReproduction de$b{diplome}$c{discipline}$e{etablissement}$d{annee}", si: "annee != null",
     priorite: 1, à_valider: true, remarque: "si l'originale est au Sudoc, reprendre sa 328 ?"}
  - {ligne: "328 #0$zReproduction de$b{diplome}$c{discipline}$e{etablissement}$d19..", si: "annee == null",
     priorite: 1, à_valider: true,
     remarque: "repli de 328$d sans année : seule $d a un repli"}
  - {ligne: "608 ##$3027253139$aThèses et écrits académiques$2rameau", priorite: 1}
  - {ligne: "686 ##$a{dewey}$2TEF", priorite: 1, à_valider: true, remarque: "granularité TEF à trancher"}
  - {ligne: "700 #1$3{auteur.ppn}$4070 || 700 #1$a{auteur.nom}$b{auteur.prenom}$4070", priorite: 1}
  - {ligne: "701 #1$3{directeur.ppn}$4727 || 701 #1$a{directeur.nom}$b{directeur.prenom}$4727", priorite: 2}
  - {ligne: "701 #1$3{president.ppn}$4956$4555 || 701 #1$a{president.nom}$b{president.prenom}$4956$4555", priorite: 2,
     à_valider: true, remarque: "double code à confirmer"}
  - {ligne: "701 #1$3{rapporteur.ppn}$4958$4555 || 701 #1$a{rapporteur.nom}$b{rapporteur.prenom}$4958$4555", priorite: 2,
     à_valider: true, remarque: "double code à confirmer"}
  - {ligne: "701 #1$3{membre_jury.ppn}$4555 || 701 #1$a{membre_jury.nom}$b{membre_jury.prenom}$4555", priorite: 2}
  - {ligne: "711 02$3{etablissement.ppn}$4295 || 711 02$a{etablissement}$4295", priorite: 1}
  - {ligne: "711 02$3{cotutelle.ppn}$4995 || 711 02$a{cotutelle}$4995", priorite: 2}
  - {ligne: "711 02$3{ecole_doctorale.ppn}$4996 || 711 02$a{ecole_doctorale}$4996", priorite: 2}

  # Zones déclarées mais non générées : listées comme « non couvertes » dans le rapport.
  - {ligne: "200 1#$d= {titre_parallele}$z{langue_titre_parallele}", actif: false, priorite: 1, à_valider: true}
  - {ligne: "215 ##$c", actif: false, priorite: 3}
  - {ligne: "215 ##$d", actif: false, priorite: 2, à_valider: true,
     remarque: "valeur fixe par type, établissement ou période ?"}
  - {ligne: "320 ##$a", actif: false, priorite: 2, à_valider: true, remarque: "à harmoniser avec 105 $ba"}
  - {ligne: "330 ##$a{resume}", actif: false, priorite: 2, à_valider: true}
  - {ligne: "510 ##$a{titre_parallele}$z{langue_titre_parallele}", actif: false, priorite: 1, à_valider: true}
  - {ligne: "541 ##$a", actif: false, priorite: 2}
  - {ligne: "600", actif: false, priorite: 1, à_valider: true, remarque: "aucune zone 600 à 607 produite (décision du 06/11)"}
  - {ligne: "610 ##$a", actif: false, priorite: 2}
  - {ligne: "711 02$3{partenaire.ppn}$4985 || 711 02$a{partenaire}$4985", actif: false, priorite: 2, à_valider: true}
