# Vérifications humaines : états « en attente » dans lesquels le traitement
# s'arrête jusqu'à ce qu'un catalogueur choisisse une suite (onglet « Reprise »
# du dossier). Une règle de décision y mène par `alors: vérification` et
# `verification: <nom>`.
#
# Chaque choix :
#   faits : corrige des faits (valeurs du dictionnaire de decisions.yaml) puis
#           relance la décision ; le traitement reprend à l'étape concernée
#   action, profil : impose une action (création, conversion, arrêt) sans
#           nouvelle décision
# Le choix, son auteur et son commentaire sont journalisés dans le dossier.

alma_incertain:
  libelle: "Alma : candidat incertain"
  question: La notice trouvée dans Alma décrit-elle ce document ?
  montrer: alma
  choix:
    - libelle: Oui, le document est déjà dans Alma
      faits: {alma: présent}
      description: arrêt, rien à produire
    - libelle: Non, faux positif
      faits: {alma: absent}
      description: le traitement reprend avec la vérification Sudoc

provenance:
  libelle: Provenance à confirmer
  question: Où la thèse a-t-elle été soutenue ?
  choix:
    - libelle: À l'EPHE
      faits: {provenance: EPHE}
    - libelle: Hors EPHE
      faits: {provenance: hors EPHE}

sudoc_a_qualifier:
  libelle: "Sudoc : résultat à qualifier"
  question: Que décrit la notice Sudoc retenue ?
  montrer: sudoc
  choix:
    - libelle: L'originale imprimée
      faits: {sudoc: originale imprimée}
    - libelle: Une reproduction imprimée
      faits: {sudoc: reproduction imprimée}
    - libelle: Une reproduction microfiche
      faits: {sudoc: reproduction microfiche}
    - libelle: La version électronique seule
      faits: {sudoc: électronique seule}
    - libelle: Aucune notice ne correspond (faux positif)
      faits: {sudoc: rien}

situation_non_prevue:
  libelle: Situation non prévue
  question: Aucune règle ne s'applique. Quelle suite donner ?
  choix:
    - libelle: Arrêter (traité hors outil)
      action: arrêt
    - libelle: Créer une notice de thèse originale imprimée
      action: création
      profil: these-originale-imprimee
    - libelle: Créer une notice de thèse de reproduction imprimée
      action: création
      profil: these-reproduction-imprimee
    - libelle: Créer une notice de mémoire
      action: création
      profil: memoire-original-imprime
