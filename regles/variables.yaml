# Dictionnaire des variables utilisables dans la notice (studio › Notice UNIMARC).
#   source         : d'où vient la valeur : extraction.<champ du prompt>, calcul,
#                    service.<service>, constante ; hors extraction, la valeur porte
#                    le nom de la variable dans le contexte
#   transformation : ce que fait le démonstrateur entre le prompt et la notice
#                    (affiché dans Administration › Prompts, « Du prompt à la notice »)
#   type           : texte (défaut), personne ({x.forme} {x.nom} {x.prenom} {x.ppn}), organisme ({x.forme} {x.ppn})
#   liste          : true si plusieurs valeurs possibles
#   disponible     : false si le pipeline ne produit pas encore la valeur (sous-zone toujours omise)
# {x} seul vaut {x.forme} pour une personne ou un organisme.

titre:              {source: extraction.title, transformation: "aucune (écrit par le VLM)", description: "Titre propre"}
titre_classement:   {source: calcul, transformation: "titre + @ devant le premier mot significatif (article initial selon la langue)", description: "Titre avec @ après l'article initial"}
sous_titre:         {source: extraction.subtitle, liste: true, transformation: "première lettre en minuscule (sauf sigle)", description: "Sous-titre(s)"}
auteur:             {source: extraction.author, type: personne, transformation: "découpage nom / prénom ; PPN d'IdRef si aligné", description: "Auteur"}
diplome:            {source: extraction.degree_type, transformation: "aucune", description: "Type de diplôme, liste fermée selon le type de document"}
discipline:         {source: extraction.discipline, transformation: "aucune (écrit par le VLM)", description: "Discipline"}
volume:             {source: extraction.volume, transformation: "aucune", description: "Numéro de tome mentionné, vide si absent"}
volumaison:         {source: calcul, transformation: "« 1 volume » si volume est vide, « ? volumes » sinon", description: "Importance matérielle"}
etablissement:      {source: extraction.granting_institution, type: organisme, transformation: "PPN d'IdRef si aligné ; sert aussi au calcul ephe (pipeline)", description: "Établissement de soutenance"}
cotutelle:          {source: extraction.co_tutelle_institutions, type: organisme, liste: true, transformation: "PPN d'IdRef si aligné", description: "Établissements de cotutelle"}
ecole_doctorale:    {source: extraction.doctoral_school, type: organisme, transformation: "PPN d'IdRef si aligné", description: "École doctorale"}
annee:              {source: extraction.defense_year, transformation: "contrôle du format aaaa (sinon vide + alerte)", description: "Année de soutenance"}
directeur:          {source: extraction.advisor, type: personne, liste: true, transformation: "découpage nom / prénom ; PPN d'IdRef si aligné", description: "Directeur(s)"}
president:          {source: extraction.jury_president, type: personne, transformation: "découpage nom / prénom ; PPN d'IdRef si aligné", description: "Président du jury"}
rapporteur:         {source: extraction.reviewers, type: personne, liste: true, transformation: "découpage nom / prénom ; PPN d'IdRef si aligné", description: "Rapporteurs"}
membre_jury:        {source: extraction.committee_members, type: personne, liste: true, transformation: "découpage nom / prénom ; PPN d'IdRef si aligné", description: "Membres du jury"}
langue:             {source: extraction.language, transformation: "aucune", description: "Langue du document, ISO 639-3"}
resume:             {source: extraction.abstract, disponible: false, description: "Résumé (champ absent du prompt actuel)"}
langue_resume:      {source: extraction.abstract_lang, disponible: false, description: "Langue du résumé"}
titre_parallele:    {source: extraction.parallel_title, disponible: false, description: "Titre parallèle"}
langue_titre_parallele: {source: extraction.parallel_title_lang, disponible: false, description: "Langue du titre parallèle"}
partenaire:         {source: extraction.partner_institutions, type: organisme, liste: true, disponible: false, description: "Établissements partenaires"}
code_etab:          {source: constante, transformation: "CODE_ETAB de .env", description: "Code établissement ABES du NNT"}
numero_nnt:         {source: calcul, disponible: false, description: "Numéro incrémental du NNT (fichier des numéros à définir)"}
dewey:              {source: service.dewey-classifier, transformation: "première classe retenue par dewey-classifier", description: "Code domaine TEF"}
