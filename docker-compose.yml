# Démonstrateur (SPEC §10). docker compose up -d
# Les règles de catalogage sont dans regles/ (YAML), monté en volume.
services:
  app:
    build: .
    image: humatheque-catalogage
    ports:
      - "8000:8000"
    env_file: .env
    volumes:
      - ./data:/app/data
      # Règles modifiées depuis Administration › Règles : écrites dans le dépôt (à commiter)
      - ./regles:/app/regles
    restart: unless-stopped
